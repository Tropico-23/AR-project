name: Validate YouTube automation

on:
  push:
    paths:
      - "youtube-automation/**"
      - ".github/workflows/youtube-automation-validate.yml"
  pull_request:
    paths:
      - "youtube-automation/**"
      - ".github/workflows/youtube-automation-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: youtube-automation/package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Cloudflare types
        run: npx wrangler types

      - name: Type check
        run: npm run check
