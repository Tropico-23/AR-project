name: Deploy YouTube automation to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "youtube-automation/**"
      - ".github/workflows/youtube-automation-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: youtube-automation/package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Cloudflare types
        run: npx wrangler types

      - name: Type check
        run: npm run check

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
