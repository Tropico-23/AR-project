<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web AR Test</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      padding: 20px;
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 18px; color: #bbb; text-align: center; }
    model-viewer {
      width: min(900px, 100%);
      height: 70vh;
      min-height: 400px;
      background: #222;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Web AR Test</h1>
  <p>Look at the astronaut, rotate it, then tap the AR button.</p>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="A 3D astronaut"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    exposure="1">
  </model-viewer>
</body>
</html>
